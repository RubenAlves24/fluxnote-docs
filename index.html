<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Técnico - Fluxnote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 300;
        }

        .subtitle {
            display: inline-block;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #c4b5fd;
            margin-top: 20px;
        }

        .sprints-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .sprint-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-decoration: none;
            color: #fff;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .sprint-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #f472b6);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .sprint-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.25);
        }

        .sprint-card:hover::before {
            transform: scaleX(1);
        }

        .sprint-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #7c3aed 0%, #00d4ff 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 2rem;
            font-weight: 700;
            box-shadow: 0 10px 30px -10px rgba(124, 58, 237, 0.5);
        }

        .sprint-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .sprint-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .sprint-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 6px 14px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 50px;
            font-size: 0.8rem;
            color: #4ade80;
        }

        .sprint-status::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Status: Em Breve */
        .sprint-status.em-breve {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .sprint-status.em-breve::before {
            background: #fbbf24;
        }

        /* Card desativado */
        .sprint-card.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .sprint-card.disabled:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .sprint-card.disabled .sprint-icon {
            background: linear-gradient(135deg, #64748b 0%, #94a3b8 100%);
            box-shadow: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            margin-top: 80px;
            color: #64748b;
            font-size: 0.85rem;
        }

        .footer a {
            color: #7c3aed;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Decorative elements */
        .decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }

        .decoration-1 {
            width: 400px;
            height: 400px;
            background: #7c3aed;
            top: -100px;
            right: -100px;
        }

        .decoration-2 {
            width: 300px;
            height: 300px;
            background: #00d4ff;
            bottom: -50px;
            left: -50px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .sprints-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div class="container">
        <header class="header">
            <h1>Manual Técnico</h1>
            <p>Documentação técnica do Projeto Fluxnote</p>
            <span class="subtitle">Engenharia de Software Aplicada • 3º Ano</span>
        </header>

        <main>
            <div class="sprints-grid" id="sprints-container">
                <!-- Os cards são gerados automaticamente pelo JavaScript -->
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 • Projeto ESA</p>
        </footer>
    </div>

    <script>
        const SPRINTS_DISPONIVEIS = [1, 2, 3];
        const TOTAL_SPRINTS = 4;

        // Função para criar o HTML de um card
        function createSprintCard(num, disponivel) {
            const ordinal = ['primeiro', 'segundo', 'terceiro', 'quarto', 'quinto', 'sexto'][num - 1] || `${num}º`;
            return `
                <a href="Sprint%20${num}/index.html" class="sprint-card${disponivel ? '' : ' disabled'}" ${disponivel ? '' : 'onclick="return false;"'}>
                    <div class="sprint-icon">S${num}</div>
                    <h2>Sprint ${num}</h2>
                    <p>Documentação técnica referente ao ${ordinal} sprint do projeto.</p>
                    <span class="sprint-status${disponivel ? '' : ' em-breve'}">${disponivel ? 'Disponível' : 'Em Breve'}</span>
                </a>
            `;
        }

        function init() {
            const container = document.getElementById('sprints-container');
            container.innerHTML = Array.from({ length: TOTAL_SPRINTS }, (_, i) => {
                const sprintNum = i + 1;
                const disponivel = SPRINTS_DISPONIVEIS.includes(sprintNum);
                return createSprintCard(sprintNum, disponivel);
            }).join('');
        }

        init();
    </script>
</body>
</html>
